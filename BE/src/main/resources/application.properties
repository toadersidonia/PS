spring.application.name=ProiectPS

spring.datasource.url=jdbc:mysql://localhost:3306/insta_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-key-change-in-production}
jwt.expiration=86400000

# Import secrets from external file (not committed to Git)
spring.config.import=optional:application-secret.properties